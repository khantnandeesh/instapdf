name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Install Playwright Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium
      # AC-46 checks every editor output with qpdf (pikepdf, MPL-2.0) and renders it with pdfium (pypdfium2, Apache-2.0/BSD).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pikepdf==10.18.2 pypdfium2==5.14.0
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  # F23 cloud sources: the same app built with the feature and the mock provider on
  # (docs/specs/f23-cloud-pickers.md §7). Runs the cloud suite plus the CSP, intake, Merge and
  # layout specs that branch on the flag, and the phone JS budget (e2e/seo). No provider keys are needed.
  web-cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NEXT_PUBLIC_CLOUD_SOURCES: "1"
      NEXT_PUBLIC_CLOUD_MOCK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install Playwright Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm --filter web exec playwright test e2e/f23/ e2e/q1/csp.spec.ts e2e/f1/ e2e/f3/ e2e/ui/ e2e/seo/ --trace off
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-cloud
          path: apps/web/playwright-report
          retention-days: 7
