name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The nightly full suite on main: the safety net for PRs that ran only the specs they affect.
  schedule:
    - cron: "0 21 * * *" # 02:30 IST
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # plan: look up the PR behind a main commit and its CI runs.
  actions: read
  pull-requests: read

jobs:
  # Decides what runs (apps/web/scripts/ci/plan.mjs): on a PR, the browser specs its change can
  # affect; on main, nothing again when the merged PR was up to date and green (same tree), else
  # the full suite; nightly, the full suite. Writes the e2e matrix, packed by measured time.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.plan.outputs.scope }}
      checks: ${{ steps.plan.outputs.checks }}
      e2e: ${{ steps.plan.outputs.e2e }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Fetch the previous main commit
        if: github.event_name == 'push' && !startsWith(github.event.before, '0000000')
        run: git fetch --no-tags --depth=1 origin "${{ github.event.before }}" || true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: node apps/web/scripts/ci/plan.mjs

  # Static checks, unit tests and the build (which is also the licence scan). Always on PRs.
  checks:
    needs: plan
    if: needs.plan.outputs.checks == 'run'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Next.js keeps its compile cache here: a warm build takes a fraction of a cold one.
      - uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: next-off-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: next-off-${{ hashFiles('pnpm-lock.yaml') }}-
      # qpdf's syntax check (via pikepdf, MPL-2.0) for the forms output tests (F16 AC-247).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pikepdf==10.18.2
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: First-load JS budget
        run: node apps/web/scripts/first-load-budget.mjs apps/web

  # The browser tests, one machine per row of the plan's matrix. Each builds the app itself (warm
  # cache, under a minute), which is quicker than waiting for another job's build.
  # "serial" rows hold the tests tagged @serial (wall-clock limits and heavy loads) on one worker.
  # The "cloud" rows build the app with F23 cloud sources and the mock provider on
  # (docs/specs/f23-cloud-pickers.md §7) and run the cloud suite plus the specs that branch on the
  # flag (CSP, intake, Merge, layout, the phone JS budget). No provider keys are needed.
  e2e:
    name: e2e (${{ matrix.name }})
    needs: plan
    if: needs.plan.outputs.e2e == 'run'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Empty outside the cloud rows: the build is then main's, without cloud sources.
      NEXT_PUBLIC_CLOUD_SOURCES: ${{ matrix.cloud }}
      NEXT_PUBLIC_CLOUD_MOCK: ${{ matrix.cloud }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache/restore@v4
        with:
          path: apps/web/.next/cache
          key: next-${{ matrix.cloud && 'on' || 'off' }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: next-${{ matrix.cloud && 'on' || 'off' }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm build
      # The checks job saves the cache of the plain build; this row saves the cloud build's.
      - uses: actions/cache/save@v4
        if: matrix.budget
        with:
          path: apps/web/.next/cache
          key: next-on-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
      # The same first-load budgets on the cloud build (its own numbers, scripts/first-load-budget.mjs).
      - name: First-load JS budget (cloud sources on)
        if: matrix.budget
        run: node apps/web/scripts/first-load-budget.mjs apps/web
      - name: Install Playwright Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium
      # AC-46 checks every editor output with qpdf (pikepdf, MPL-2.0) and renders it with pdfium (pypdfium2, Apache-2.0/BSD).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pikepdf==10.18.2 pypdfium2==5.14.0
      - name: Playwright
        env:
          FILES: ${{ matrix.files }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: e2e-report.json
        run: pnpm --filter web exec playwright test --trace off --reporter=dot,json --pass-with-no-tests ${{ matrix.args }} $FILES
      # Durations for e2e/timings.json (scripts/ci/timings.mjs); the nightly full run's are the ones to use.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-timings-${{ strategy.job-index }}
          path: apps/web/e2e-report.json
          retention-days: 5
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: apps/web/test-results
          retention-days: 7

  # The one check other things wait for: passes only if every job the plan asked for passed.
  web:
    if: always()
    needs: [plan, checks, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All web jobs passed
        env:
          SCOPE: ${{ needs.plan.outputs.scope }}
          PLAN: ${{ needs.plan.result }}
          CHECKS: ${{ needs.checks.result }}
          CHECKS_PLANNED: ${{ needs.plan.outputs.checks }}
          E2E: ${{ needs.e2e.result }}
          E2E_PLANNED: ${{ needs.plan.outputs.e2e }}
        run: |
          echo "Scope: $SCOPE. plan=$PLAN checks=$CHECKS (planned $CHECKS_PLANNED) e2e=$E2E (planned $E2E_PLANNED)"
          [ "$PLAN" = "success" ] || { echo "::error::The plan job ended as $PLAN"; exit 1; }
          ok() { [ "$1" = "success" ] || { [ "$1" = "skipped" ] && [ "$2" = "skip" ]; }; }
          ok "$CHECKS" "$CHECKS_PLANNED" || { echo "::error::checks ended as $CHECKS"; exit 1; }
          ok "$E2E" "$E2E_PLANNED" || { echo "::error::e2e ended as $E2E"; exit 1; }
