name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    # The e2e suite alone now takes about 20 minutes on a runner (desktop and mobile), so 20 cancelled the job mid-run.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Install Playwright Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium
      # AC-46 checks every editor output with qpdf (pikepdf, MPL-2.0) and renders it with pdfium (pypdfium2, Apache-2.0/BSD).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pikepdf==10.18.2 pypdfium2==5.14.0
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
