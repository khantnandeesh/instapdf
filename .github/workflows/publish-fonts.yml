name: Publish font library

# Builds the full font library (every family of the open catalogues that passes the licence gate,
# and the pinned families of scripts/font-library/extras.mjs)
# and uploads it to the fonts bucket. Run by hand from main. A publish then starts a staging deploy
# (owner, 2026-11-25), since the licences page and notices are built into the image from the
# published family list (F24 AC-271). See infra/README.md "Fonts bucket".
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Trial run: build only the first N families and upload nothing. Empty: build all and publish."
        required: false
        default: ""

permissions:
  contents: read
  id-token: write
  # Only to start deploy-staging.yml after a publish (the last step).
  actions: write

concurrency:
  group: publish-fonts
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.ref == 'refs/heads/main' && vars.GCP_WIF_PROVIDER != '' && vars.GCP_PROJECT_ID != '' }}
    runs-on: ubuntu-latest
    # About two seconds a family (one request a second to the registry), 2,100 families.
    timeout-minutes: 180
    env:
      BUCKET: ${{ vars.GCP_PROJECT_ID }}-fonts
      LIMIT: ${{ inputs.limit }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The builder uses only Node's own modules and the matcher module committed in public/engine.
      - name: Read the catalogues (licence gate)
        working-directory: apps/web
        run: node scripts/font-library/crawl.mjs --out "$RUNNER_TEMP/catalogue"

      - name: Build the library
        working-directory: apps/web
        run: |
          case "$LIMIT" in
            "") extra=(--min-families 1900) ;;
            *[!0-9]* | 0) echo "limit must be a number above 0" >&2; exit 2 ;;
            *) extra=(--limit "$LIMIT") ;;
          esac
          node --no-warnings scripts/font-library/build-library.mjs \
            --out "$RUNNER_TEMP/library" --source npm \
            --catalogue "$RUNNER_TEMP/catalogue/catalogue.json" --extras --clean "${extra[@]}" 2> >(tee "$RUNNER_TEMP/skipped.txt" | tail -n 40 >&2)
          echo "Skipped or failed: $(wc -l < "$RUNNER_TEMP/skipped.txt") lines (see the artifact)"
          du -sh "$RUNNER_TEMP/library"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: font-library-report
          path: |
            ${{ runner.temp }}/catalogue/summary.json
            ${{ runner.temp }}/catalogue/rejected.json
            ${{ runner.temp }}/skipped.txt
            ${{ runner.temp }}/library/manifest.json
          retention-days: 30

      # A trial run (limit set) stops here: only a full build is ever published.
      - uses: google-github-actions/auth@v2
        if: inputs.limit == ''
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: gh-fonts-publish@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2
        if: inputs.limit == ''

      # Content-addressed files first (a name never changes its bytes, so existing ones are left
      # alone), manifest.json last: the site only ever sees a manifest whose files are all there.
      - name: Upload
        if: inputs.limit == ''
        working-directory: ${{ runner.temp }}/library
        run: |
          forever="public, max-age=31536000, immutable"
          gcloud storage cp --recursive --no-clobber --cache-control="$forever" fonts "gs://$BUCKET/"
          gcloud storage cp --recursive --no-clobber --cache-control="$forever" --gzip-local=json families "gs://$BUCKET/"
          gcloud storage cp --recursive --no-clobber --cache-control="$forever" --gzip-local=json index "gs://$BUCKET/"
          gcloud storage cp --recursive --cache-control="public, max-age=86400" --content-type="text/plain; charset=utf-8" licences "gs://$BUCKET/"
          # A dated copy of every manifest published: going back is one copy onto manifest.json.
          gcloud storage cp --cache-control="private, max-age=0" manifest.json "gs://$BUCKET/manifests/$(date -u +%Y%m%dT%H%M%SZ).json"
          gcloud storage cp --cache-control="public, max-age=300" manifest.json "gs://$BUCKET/manifest.json"

      - name: Check what the site will read
        if: inputs.limit == ''
        run: |
          curl -fsS "https://storage.googleapis.com/$BUCKET/manifest.json" | tee /dev/stderr | grep -q '"families"'

      # The licences page lists the families of the image's build: a new image is built now, so
      # no served family is ever missing from it for longer than one deploy.
      - name: Start a staging deploy
        if: inputs.limit == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-staging.yml --ref main --repo "$GITHUB_REPOSITORY"
