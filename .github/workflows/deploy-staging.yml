name: Deploy staging

on:
  # Deploy only commits on main that passed CI.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  REGION: us-central1
  SERVICE: web-staging
  # workflow_run: the commit CI tested; workflow_dispatch: the dispatched commit.
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  deploy:
    # Skip until the GCP bootstrap is done and the repo variables exist (infra/README.md).
    # workflow_run: only a successful CI run for a push to main in this repo
    # (not a PR whose head branch happens to be called main).
    # workflow_dispatch: only from main (WIF also rejects other refs).
    if: >-
      ${{ vars.GCP_WIF_PROVIDER != '' && vars.GCP_DEPLOYER_SA_STAGING != '' && (
        (github.event_name == 'workflow_run'
          && github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'push'
          && github.event.workflow_run.head_repository.full_name == github.repository)
        || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      ) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0

      # CI runs can finish out of order; never deploy a commit older than main's tip.
      - name: Skip if not the tip of main
        id: fresh
        run: |
          git fetch --no-tags origin main
          if git merge-base --is-ancestor origin/main "$SHA"; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::${SHA} is behind origin/main; a newer commit will deploy. Skipping."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: google-github-actions/auth@v2
        if: steps.fresh.outputs.deploy == 'true'
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA_STAGING }}

      - uses: google-github-actions/setup-gcloud@v2
        if: steps.fresh.outputs.deploy == 'true'

      - name: Configure Docker for Artifact Registry
        if: steps.fresh.outputs.deploy == 'true'
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push image
        if: steps.fresh.outputs.deploy == 'true'
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          FONTS_BUCKET: ${{ vars.FONTS_BUCKET }}
        run: |
          image="${REGION}-docker.pkg.dev/${PROJECT_ID}/instapdf/web:${SHA}"
          echo "IMAGE=${image}" >> "$GITHUB_ENV"
          # The fonts bucket serves the font library once the publish workflow has filled it
          # (infra/README.md "Fonts bucket"). The bucket's name comes from a repository variable
          # set after Terraform created it, never from a guess: bucket names are global, so a
          # guessed name could be someone else's. No variable, or no manifest yet (404): the
          # image carries the small in-app copy. Any other answer fails the deploy, so a passing
          # hiccup can't quietly shrink the library.
          fonts=""
          if [ -n "$FONTS_BUCKET" ]; then
            code="$(curl -sS --max-time 20 --retry 3 -o /dev/null -w '%{http_code}' "https://storage.googleapis.com/${FONTS_BUCKET}/manifest.json")"
            case "$code" in
              200) fonts="https://storage.googleapis.com/${FONTS_BUCKET}" ;;
              404) ;;
              *) echo "::error::Fonts bucket answered ${code} for manifest.json"; exit 1 ;;
            esac
          fi
          echo "::notice::Font library: ${fonts:-in-app copy}"
          docker build -f apps/web/Dockerfile --build-arg "FONTS_ORIGIN=${fonts}" -t "$image" .
          docker push "$image"

      - name: Deploy to Cloud Run
        if: steps.fresh.outputs.deploy == 'true'
        run: |
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --region "$REGION" \
            --update-env-vars "APP_VERSION=${SHA}" \
            --quiet

      - name: Smoke test
        if: steps.fresh.outputs.deploy == 'true'
        run: |
          url="$(gcloud run services describe "$SERVICE" --region "$REGION" --format='value(status.url)')"
          .github/scripts/smoke-test.sh "$url" "$SHA"
