name: Deploy staging

on:
  # Deploy only commits on main that passed CI.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  REGION: us-central1
  SERVICE: web-staging
  # workflow_run: the commit CI tested; workflow_dispatch: the dispatched commit.
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  deploy:
    # Skip until the GCP bootstrap is done and the repo variables exist (infra/README.md).
    # workflow_run: only a successful CI run for a push to main in this repo
    # (not a PR whose head branch happens to be called main).
    # workflow_dispatch: only from main (WIF also rejects other refs).
    if: >-
      ${{ vars.GCP_WIF_PROVIDER != '' && vars.GCP_DEPLOYER_SA_STAGING != '' && (
        (github.event_name == 'workflow_run'
          && github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'push'
          && github.event.workflow_run.head_repository.full_name == github.repository)
        || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      ) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0

      # CI runs can finish out of order; never deploy a commit older than main's tip.
      - name: Skip if not the tip of main
        id: fresh
        run: |
          git fetch --no-tags origin main
          if git merge-base --is-ancestor origin/main "$SHA"; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::${SHA} is behind origin/main; a newer commit will deploy. Skipping."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: google-github-actions/auth@v2
        if: steps.fresh.outputs.deploy == 'true'
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA_STAGING }}

      - uses: google-github-actions/setup-gcloud@v2
        if: steps.fresh.outputs.deploy == 'true'

      - name: Configure Docker for Artifact Registry
        if: steps.fresh.outputs.deploy == 'true'
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push image
        if: steps.fresh.outputs.deploy == 'true'
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          # F23 cloud sources: public IDs from repository variables (not secrets). Prod promotes this same image.
          NEXT_PUBLIC_CLOUD_SOURCES: ${{ vars.NEXT_PUBLIC_CLOUD_SOURCES }}
          NEXT_PUBLIC_DROPBOX_APP_KEY: ${{ vars.NEXT_PUBLIC_DROPBOX_APP_KEY }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          NEXT_PUBLIC_GOOGLE_API_KEY: ${{ vars.NEXT_PUBLIC_GOOGLE_API_KEY }}
          NEXT_PUBLIC_GOOGLE_APP_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_APP_ID }}
          NEXT_PUBLIC_ONEDRIVE_CLIENT_ID: ${{ vars.NEXT_PUBLIC_ONEDRIVE_CLIENT_ID }}
        run: |
          image="${REGION}-docker.pkg.dev/${PROJECT_ID}/instapdf/web:${SHA}"
          echo "IMAGE=${image}" >> "$GITHUB_ENV"
          docker build -f apps/web/Dockerfile -t "$image" \
            --build-arg NEXT_PUBLIC_CLOUD_SOURCES --build-arg NEXT_PUBLIC_DROPBOX_APP_KEY \
            --build-arg NEXT_PUBLIC_GOOGLE_CLIENT_ID --build-arg NEXT_PUBLIC_GOOGLE_API_KEY \
            --build-arg NEXT_PUBLIC_GOOGLE_APP_ID --build-arg NEXT_PUBLIC_ONEDRIVE_CLIENT_ID .
          docker push "$image"

      - name: Deploy to Cloud Run
        if: steps.fresh.outputs.deploy == 'true'
        run: |
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --region "$REGION" \
            --update-env-vars "APP_VERSION=${SHA}" \
            --quiet

      - name: Smoke test
        if: steps.fresh.outputs.deploy == 'true'
        run: |
          url="$(gcloud run services describe "$SERVICE" --region "$REGION" --format='value(status.url)')"
          .github/scripts/smoke-test.sh "$url" "$SHA"
