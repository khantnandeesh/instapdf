name: Engine

on:
  pull_request:
    paths: ["crates/**", "tests/parity/editor/**", ".github/workflows/engine.yml"]
  push:
    branches: [main]
    paths: ["crates/**", "tests/parity/editor/**", ".github/workflows/engine.yml"]

concurrency:
  group: engine-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  WASM_BINDGEN_VERSION: 0.2.130

jobs:
  engine:
    # Pinned image: the test fonts and their paths in the tests come from it.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: crates
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: |
          # Pinned so a new stable release can't turn new lints red overnight.
          rustup toolchain install 1.100.0 --profile minimal --no-self-update
          rustup default 1.100.0
          rustup component add rustfmt clippy
          rustup target add wasm32-unknown-unknown
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen
            crates/target
          key: engine-${{ runner.os }}-${{ env.WASM_BINDGEN_VERSION }}-${{ hashFiles('crates/Cargo.lock') }}
          restore-keys: engine-${{ runner.os }}-${{ env.WASM_BINDGEN_VERSION }}-
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      # berry-engine alone builds without the `shaping` feature (the default WebAssembly engine).
      - run: cargo clippy -p berry-engine --all-targets --locked -- -D warnings
      - name: Test fonts (tests register Liberation Sans as a fallback)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-liberation fonts-crosextra-carlito fonts-crosextra-caladea
      - run: cargo test --locked
      - run: cargo test -p berry-engine --locked
      - name: Dependency licences
        run: python3 oracle/check_licences.py
      - name: Build WebAssembly
        run: |
          command -v wasm-bindgen || cargo install wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION" --locked
          # Two modules: the default engine, and the full one with complex-script shaping.
          cargo build -p berry-wasm --target wasm32-unknown-unknown --release --locked
          wasm-bindgen target/wasm32-unknown-unknown/release/berry_wasm.wasm --out-dir berry-wasm/pkg --target web --out-name berry_engine
          # Built for size (profile wasm-shaping in crates/Cargo.toml) to stay inside the budget.
          cargo build -p berry-wasm --features shaping --target wasm32-unknown-unknown --profile wasm-shaping --locked
          wasm-bindgen target/wasm32-unknown-unknown/wasm-shaping/berry_wasm.wasm --out-dir berry-wasm/pkg --target web --out-name berry_engine_shaping
      - name: WebAssembly smoke test and size budget
        run: |
          node berry-wasm/smoke.mjs
          BERRY_ENGINE=berry_engine_shaping node berry-wasm/smoke.mjs
          for m in berry_engine berry_engine_shaping; do
            size=$(gzip -9 -c "berry-wasm/pkg/${m}_bg.wasm" | wc -c)
            echo "${m}_bg.wasm: $size bytes gzip"
            test "$size" -le 1000000
          done
          # The default module loads on every editor visit: it must not grow (see engine-manifest.test.ts).
          test "$(gzip -9 -c berry-wasm/pkg/berry_engine_bg.wasm | wc -c)" -le 792277
      - name: PDFium oracle over the editor corpus
        run: |
          pip install --quiet pypdfium2==5.14.0 pikepdf==10.18.2 pillow==13.0.0 uharfbuzz==0.57.0
          cargo build -p berry-cli --locked
          python3 oracle/run_corpus.py
          python3 oracle/check_shaping.py
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: engine-oracle
          path: crates/target/oracle
          retention-days: 7
