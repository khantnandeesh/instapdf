<text x="960" y="190" font-size="11" fill="#6b3fd1" text-anchor="start" font-weight="500">DropCard (reused), min-h 360, max-h calc(100dvh - 200px)</text>
<text x="960" y="300" font-size="11" fill="#6b3fd1" text-anchor="start" font-weight="500">Primary: the only berry fill</text>
<text x="20" y="560" font-size="11" fill="#6b3fd1" text-anchor="start" font-weight="500">Below the fold: ToolSeo guide (how-to, FAQ). Nothing else above the fold.</text>
<text x="20" y="580" font-size="11" fill="#6b3fd1" text-anchor="start" font-weight="500">Same composition fits 1366x768 and 1440x900 (card centred, more air).</text>
<text x="20" y="600" font-size="11" fill="#6b3fd1" text-anchor="start" font-weight="500">Editor chunk prefetch starts on pointerenter/focus of Open PDF or on idle after LCP.</text>
