<text x="640" y="476" font-size="13" fill="#7a6468" text-anchor="middle" font-weight="400">[shield] Stays on this device</text>
<line x1="0" y1="718" x2="1280" y2="718" stroke="#6b3fd1" stroke-width="1.5" stroke-dasharray="6 4"/>
