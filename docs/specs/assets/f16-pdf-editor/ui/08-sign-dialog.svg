<text x="500" y="116" font-size="11" fill="#6b3fd1" text-anchor="start" font-weight="500">tiles have fixed size so nothing shifts.</text>
<text x="500" y="140" font-size="11" fill="#6b3fd1" text-anchor="start" font-weight="500">Draw: pad 392x160, baseline, pointer events with pressure,</text>
<text x="500" y="156" font-size="11" fill="#6b3fd1" text-anchor="start" font-weight="500">Clear and colour swatches.</text>
<text x="500" y="176" font-size="11" fill="#6b3fd1" text-anchor="start" font-weight="500">Upload: PNG/JPEG; 'Remove background' switch on by default.</text>
<text x="500" y="200" font-size="11" fill="#6b3fd1" text-anchor="start" font-weight="500">Place: desktop = ghost follows cursor, click to drop;</text>
<text x="500" y="216" font-size="11" fill="#6b3fd1" text-anchor="start" font-weight="500">touch/keyboard = dropped in the centre of the view, selected.</text>
