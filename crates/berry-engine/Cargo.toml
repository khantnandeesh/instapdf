[package]
name = "berry-engine"
description = "BerryPDF edit engine: text extraction, font coverage, surgical text replacement and save verification"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
lopdf = { version = "0.47", default-features = false }
ttf-parser = "0.25"
subsetter = "0.2"
serde = { version = "1", features = ["derive"] }
rustybuzz = "0.20.1"
unicode-bidi = "0.3.18"
unicode-properties = { version = "0.1.5", default-features = false, features = ["general-category"] }
unicode-script = "0.5.9"
unicode-bidi-mirroring = "0.4.0"
