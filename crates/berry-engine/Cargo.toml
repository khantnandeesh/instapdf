[package]
name = "berry-engine"
description = "BerryPDF edit engine: text extraction, font coverage, surgical text replacement and save verification"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
lopdf = { version = "0.47", default-features = false }
ttf-parser = "0.25"
subsetter = "0.2"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
serde = { version = "1", features = ["derive"] }
