[package]
name = "berry-engine"
description = "BerryPDF edit engine: text extraction, font coverage, surgical text replacement and save verification"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
lopdf = { version = "0.47", default-features = false }
ttf-parser = "0.25"
subsetter = "0.2"
# Same build lopdf already uses: unpacks WOFF 1.0 fonts passed to add_font.
flate2 = "1.1"
serde = { version = "1", features = ["derive"] }
rustybuzz = { version = "0.20.1", optional = true }
unicode-bidi = { version = "0.3.18", optional = true }
unicode-bidi-mirroring = "0.4.0"

[features]
# Editing Hindi, Arabic and other complex-script text: the rustybuzz shaper. Off by default so
# the engine most people download stays small; without it such lines read correctly but are
# read-only with "needs-shaping".
shaping = ["dep:rustybuzz", "dep:unicode-bidi"]
