[package]
name = "berry-fontmatch-wasm"
description = "Browser bindings for berry-fontmatch: the font matcher the editor loads only when a match is needed"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
berry-fontmatch = { path = "../berry-fontmatch" }
wasm-bindgen = "=0.2.130"
js-sys = "0.3"
